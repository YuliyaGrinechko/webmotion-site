name: Deploy to ukraine.com.ua

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Upload via SSH (rsync)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -rltvz --chmod=D755,F644 \
            --exclude '.git' --exclude '.github' --exclude 'README.md' \
            -e "sshpass -e ssh -p $PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
